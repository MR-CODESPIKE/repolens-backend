services:
  - type: web
    name: repolens-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FREE_DAILY_LIMIT
        value: 5

  - type: worker
    name: repolens-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false

# Note: Redis itself isn't defined here since Render's managed Redis is
# typically added separately from the dashboard (Render Key Value add-on)
# and its connection URL pasted into REDIS_URL on both services above.
